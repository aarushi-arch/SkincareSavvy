{% load static %}
<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting to eSewa — {{ product.name }}</title>
  </head>
  <body>
    <div style="max-width:720px;margin:80px auto;text-align:center;font-family:Inter, sans-serif;color:#333">
      <h3>Redirecting to eSewa...</h3>
      <p>Please wait while we prepare your payment for <strong>{{ product.name }}</strong>.</p>
      {{ form|safe }}
      <noscript>
        <p>Please click the button below to continue to payment.</p>
      </noscript>
    </div>

    <script>
      (function(){
        if(document.forms && document.forms[0]){
          document.forms[0].submit();
        }
      })();
    </script>
  </body>
</html>
