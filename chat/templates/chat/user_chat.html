<style>
.chat-messages-container {
    height: 400px;
    overflow-y: auto;
    padding: 15px;
    background: #f9f9f9;
    border: 1px solid #eee;
    margin-bottom: 20px;
    border-radius: 8px;
}

.chat-input-container {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 15px;
}

#message {
    flex-grow: 1;
    padding: 10px 15px;
    border: 1px solid #ccc;
    border-radius: 20px;
    outline: none;
}

#message:focus {
    border-color: #4CAF50;
}

.send-btn {
    background: #4CAF50;
    color: white;
    border: none;
    border-radius: 50%;
    width: 45px;
    height: 45px;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    transition: background 0.3s ease;
    flex-shrink: 0;
}

.send-btn:hover {
    background: #45a049;
}
</style>

<h2>Chat with Support</h2>

<div id="chat-messages" class="chat-messages-container">
{% for msg in messages %}
<p>
<b>{{msg.sender.username}}</b> : {{msg.message}}
</p>
{% endfor %}
</div>

<div class="chat-input-container">
    <input type="text" id="message" placeholder="Type your message...">
    <button onclick="sendMessage()" class="send-btn" title="Send Message">
        <i class="fas fa-paper-plane"></i>
    </button>
</div>

<script>
function sendMessage(){
    let message = document.getElementById("message").value;
    if (message.trim() === "") return;
    fetch("/chat/send-message/", {
        method: "POST",
        headers: {
            "Content-Type": "application/x-www-form-urlencoded",
            "X-CSRFToken": "{{csrf_token}}"
        },
        body: "message=" + encodeURIComponent(message) + "&receiver={{admin_user.id}}"
    }).then(response => response.json())
    .then(data => {
        document.getElementById("message").value = "";
        loadMessages();
    });
}

function loadMessages(){
    fetch("/chat/get-messages/?receiver={{admin_user.id}}")
    .then(response => response.json())
    .then(data => {
        let chatDiv = document.getElementById("chat-messages");
        chatDiv.innerHTML = "";
        data.messages.forEach(msg => {
            let p = document.createElement("p");
            p.innerHTML = "<b>" + msg.sender_username + "</b> : " + msg.message;
            chatDiv.appendChild(p);
        });
    });
}

// Load messages every 5 seconds
setInterval(loadMessages, 5000);

// Initial load
loadMessages();
</script>
