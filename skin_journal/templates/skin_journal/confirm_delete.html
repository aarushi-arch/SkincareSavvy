{% extends "base.html" %}
{% block title %}Delete Entry{% endblock %}
{% block content %}
<div style="background:#f6f8f6;min-height:100vh;padding:4rem 0;display:flex;align-items:center;">
  <div class="container">
    <div style="max-width:420px;margin:0 auto;background:#fff;border-radius:14px;
                padding:2.5rem;box-shadow:0 4px 24px rgba(0,0,0,.07);text-align:center;
                border:1px solid #eaf0ea;">
      <div style="width:48px;height:48px;border-radius:50%;background:#ffebee;
                  display:flex;align-items:center;justify-content:center;margin:0 auto 1.25rem;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#c62828" stroke-width="1.8" stroke-linecap="round">
          <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/>
          <path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/>
        </svg>
      </div>
      <h4 style="font-weight:700;color:#263238;margin:0 0 .4rem;font-size:1.1rem;">Delete this entry?</h4>
      <p style="color:#94a3b8;font-size:.85rem;margin:0 0 1.75rem;">
        {{ entry.date|date:"d F Y" }} &mdash; this action cannot be undone.
      </p>
      <form method="post" style="display:flex;gap:.75rem;justify-content:center;">
        {% csrf_token %}
        <button type="submit"
                style="padding:10px 22px;border-radius:6px;border:none;
                       background:#c62828;color:#fff;font-weight:600;font-size:.85rem;cursor:pointer;">
          Delete
        </button>
        <a href="{% url 'skin_journal:detail' entry.pk %}"
           style="padding:10px 22px;border-radius:6px;border:1px solid #eaf0ea;
                  color:#546e7a;font-weight:600;font-size:.85rem;text-decoration:none;
                  display:inline-flex;align-items:center;">
          Cancel
        </a>
      </form>
    </div>
  </div>
</div>
{% endblock %}
