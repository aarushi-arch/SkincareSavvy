{% extends "base.html" %}
{% block title %}Delete Entry{% endblock %}
{% block content %}
<div class="container py-5" style="max-width:480px;margin:0 auto;text-align:center;">
  <div style="background:#fff;border-radius:20px;padding:2.5rem;box-shadow:0 4px 24px rgba(0,0,0,.08);">
    <div style="font-size:2.5rem;margin-bottom:1rem;">🗑️</div>
    <h4 style="font-weight:700;color:#0f172a;">Delete this entry?</h4>
    <p class="text-muted">{{ entry.date|date:"d F Y" }} — this cannot be undone.</p>
    <form method="post" class="d-flex gap-2 justify-content-center mt-3">
      {% csrf_token %}
      <button type="submit"
              style="padding:11px 24px;border-radius:50px;border:none;
                     background:#dc2626;color:#fff;font-weight:700;cursor:pointer;">
        Yes, Delete
      </button>
      <a href="{% url 'skin_journal:detail' entry.pk %}"
         style="padding:11px 24px;border-radius:50px;border:1.5px solid #e2e8f0;
                color:#64748b;font-weight:600;text-decoration:none;">
        Cancel
      </a>
    </form>
  </div>
</div>
{% endblock %}
